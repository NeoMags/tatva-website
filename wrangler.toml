# Cloudflare Pages configuration. Secrets are set in the dashboard, never here.
# `name` must match the Pages project name.
name = "tatva-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# D1 database for enquiries and assistant requests (the id is not a secret).
[[d1_databases]]
binding = "DB"
database_name = "tatva"
database_id = "3c9a16fb-055c-4a03-87a1-0c80715f4bd3"
migrations_dir = "migrations"

# Workers AI (speech-to-text for voice notes). Free daily allowance: 10,000 neurons.
[ai]
binding = "AI"
